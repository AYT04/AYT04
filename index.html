<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AYT04</title>
    
    <!-- Open Graph / Meta -->
    <meta property="og:title" content="AYT04">
    <meta property="og:description" content="My interactive sandbox & ShulkerOS.">
    <meta property="og:image" content="https://avatars.githubusercontent.com/u/153463910?v=4">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#7f12d8">

    <!-- Styles & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inconsolata:wght@400;700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: linear-gradient(135deg, #0f021e 0%, #160222 50%, #290014 100%);
            color: #f1f5f9;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Ambient Background Grid and Glows */
        .ambient-grid {
            background-image: linear-gradient(rgba(127, 18, 216, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(127, 18, 216, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .glow-orb-1 {
            filter: blur(140px);
            background: radial-gradient(circle, rgba(127, 18, 216, 0.3) 0%, rgba(255, 0, 51, 0.0) 70%);
        }

        .glow-orb-2 {
            filter: blur(140px);
            background: radial-gradient(circle, rgba(255, 0, 51, 0.25) 0%, rgba(127, 18, 216, 0) 70%);
        }

        /* Glassmorphism Classes */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(127, 18, 216, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(127, 18, 216, 0.2);
        }

        .glass-nav-btn {
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .glass-nav-btn.active {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
        }

        /* Leaflet tweaks */
        .leaflet-container {
            font-family: inherit;
            background: #1e1b24 !important;
        }

        /* RTD Documentation Subtheme Elements */
        .doc-sidebar-btn {
            transition: all 0.2s ease;
        }
        .doc-sidebar-btn.active {
            background: rgba(127, 18, 216, 0.2);
            color: #ffffff;
            border-left: 4px solid #7f12d8;
        }

        /* Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(127, 18, 216, 0.3);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(127, 18, 216, 0.5);
        }

        /* Code View custom */
        .code-container {
            font-family: 'Inconsolata', monospace;
        }
    </style>
</head>
<body class="relative min-h-screen pb-12">

    <!-- Interactive Ambient Canvas/Glow Elements -->
    <div class="absolute inset-0 ambient-grid pointer-events-none z-0"></div>
    <div class="absolute top-10 left-1/4 w-[500px] h-[500px] glow-orb-1 rounded-full pointer-events-none z-0"></div>
    <div class="absolute bottom-10 right-1/4 w-[600px] h-[600px] glow-orb-2 rounded-full pointer-events-none z-0"></div>

    <main class="max-w-7xl mx-auto px-4 py-8 relative z-10">

        <!-- ================= PAGE: CONTACT ================= -->
        <section id="page-home" class="app-route hidden max-w-lg mx-auto">
            <div class="glass-panel rounded-3xl p-8 md:p-10 shadow-2xl relative overflow-hidden border-white/10">
                <div class="absolute -top-32 -left-32 w-64 h-64 bg-[#ff0033]/10 blur-3xl rounded-full"></div>
                
                <div class="mb-8 text-center">
                    <h1 class="text-3xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white to-red-400 mb-2">Contact Us</h1>
                    <p class="text-xs text-slate-400">Have questions or ready to start a conversation? Fill out the form below.
                        <br>
                        Let's build the future of technology together
                    </p>
                </div>

                <form id="contactForm" onsubmit="handleContactSubmit(event)" class="space-y-5 relative z-10">
                    <div>
                        <label for="contact-subject" class="block text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-1.5 ml-1">Message:</label>
                        <input type="text" id="contact-subject" placeholder="What's the subject?" required 
                        class="block w-full px-4 py-3.5 bg-white/5 border border-white/10 rounded-2xl text-white placeholder-white/30 focus:ring-2 focus:ring-[#7f12d8]/50 focus:border-transparent outline-none transition-all text-sm font-medium">
                    </div>
                    
                    <button type="submit" class="w-full py-4 px-6 bg-gradient-to-r from-[#7f12d8] to-[#ff0033] hover:brightness-110 active:scale-95 text-white font-bold rounded-2xl transition-all duration-200 shadow-xl shadow-[#7f12d8]/20 text-sm flex items-center justify-center gap-2">
                        Send? <i data-lucide="send" class="w-4 h-4"></i>
                    </button>
                </form>

                <div id="contact-success" class="mt-8 p-4 bg-emerald-950/20 border border-emerald-500/30 rounded-2xl hidden animate-pulse">
                    <p class="text-center font-bold text-emerald-400 text-sm flex items-center justify-center gap-1.5">
                        <i data-lucide="check-circle" class="w-4 h-4"></i> Sent!
                    </p>
                </div>
            </div>
        </section>

    </main>

    <script>
        // ================= SPA NAVIGATION ENGINE =================
        function navigate(routeId) {
            // Update URL Hash
            window.location.hash = `#/${routeId}`;
        }

        function handleSPAHashRoute() {
            const rawHash = window.location.hash || '#/home';
            const routeId = rawHash.replace('#/', '');

            // Hide all routing container pages
            document.querySelectorAll('.app-route').forEach(page => page.classList.add('hidden'));
            
            // Remove active indicator classes from top nav links
            document.querySelectorAll('.glass-nav-btn').forEach(btn => btn.classList.remove('active'));

            const targetPage = document.getElementById(`page-${routeId}`);
            const targetNav = document.getElementById(`nav-${routeId}`);

            if (targetPage) {
                targetPage.classList.remove('hidden');
            } else {
                // Fallback to home
                document.getElementById('page-home').classList.remove('hidden');
                document.getElementById('nav-home').classList.add('active');
                return;
            }

            if (targetNav) {
                targetNav.classList.add('active');
            }
        }

        window.addEventListener('hashchange', handleSPAHashRoute);

        function handleContactSubmit(e) {
            e.preventDefault();
            const subjectInput = document.getElementById('contact-subject').value;

            const email = 'ayt04@duck.com';
            const subject = encodeURIComponent(subjectInput);
            
            const mailtoLink = `mailto:${email}?subject=${subject}`;

            window.open(mailtoLink, '_blank');
            
            document.getElementById('contact-success').classList.remove('hidden');
            showToast("Check your Inbox!");
        }

        window.onload = function() {
            lucide.createIcons();
            handleSPAHashRoute();
        };
    </script>
</body>
</html>
